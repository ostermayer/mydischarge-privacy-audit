<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #111; }
    .zone-label { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
    .box-title { font-size: 13px; font-weight: 700; fill: #111; }
    .box-sub { font-size: 11px; fill: #333; }
    .layer-title { font-size: 12px; font-weight: 700; fill: #111; }
    .layer-sub { font-size: 10px; fill: #444; }
    .list { font-size: 11px; fill: #222; }
    .list-title { font-size: 12px; font-weight: 700; fill: #111; }
    .note { font-size: 10px; fill: #555; }
    .stamp { font-size: 10px; font-weight: 700; fill: #b00020; }
    .stamp-ok { font-size: 10px; font-weight: 700; fill: #0a7c2f; }
    .arrow { stroke: #333; stroke-width: 1.5; fill: none; }
    .arrow-green { stroke: #0a7c2f; stroke-width: 1.8; fill: none; }
    .arrow-red { stroke: #b00020; stroke-width: 1.8; fill: none; }
    .zone-device  { fill: #eef4ff; stroke: #2b6cb0; stroke-width: 2; stroke-dasharray: 6 4; }
    .zone-proxy   { fill: #fff5e6; stroke: #c76a00; stroke-width: 2; stroke-dasharray: 6 4; }
    .zone-llm     { fill: #f3e8ff; stroke: #6b21a8; stroke-width: 2; stroke-dasharray: 6 4; }
    .card         { fill: #ffffff; stroke: #333; stroke-width: 1; }
    .card-device  { fill: #ffffff; stroke: #2b6cb0; stroke-width: 1.2; }
    .card-proxy   { fill: #ffffff; stroke: #c76a00; stroke-width: 1.2; }
    .card-llm     { fill: #ffffff; stroke: #6b21a8; stroke-width: 1.2; }
    .pill-removed { fill: #fde8e8; stroke: #b00020; stroke-width: 1; }
    .pill-kept    { fill: #e6f4ea; stroke: #0a7c2f; stroke-width: 1; }
    .hilite       { fill: #fff3cd; stroke: #8a6d00; stroke-width: 1.2; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#333"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#0a7c2f"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#b00020"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="30" class="title" text-anchor="middle">Figure 1. MyDischarge Privacy-Preserving Data Flow</text>
  <text x="550" y="50" class="note" text-anchor="middle">Privacy-preserving techniques are applied at three stages before any text reaches the third-party LLM.</text>

  <!-- ======================= DEVICE ZONE ======================= -->
  <rect x="20" y="70" width="560" height="640" rx="10" class="zone-device"/>
  <text x="40" y="93" class="zone-label" fill="#2b6cb0">1 &#8212; ON DEVICE (Patient's phone)</text>
  <text x="40" y="110" class="note">Photo and OCR text never leave the device.</text>

  <!-- Capture + OCR -->
  <rect x="45" y="125" width="160" height="70" rx="6" class="card-device"/>
  <text x="125" y="148" class="box-title" text-anchor="middle">Photo / PDF</text>
  <text x="125" y="166" class="box-sub" text-anchor="middle">Captured by patient</text>
  <text x="125" y="182" class="box-sub" text-anchor="middle">(image stays on device)</text>

  <rect x="45" y="215" width="160" height="70" rx="6" class="card-device"/>
  <text x="125" y="238" class="box-title" text-anchor="middle">On-Device OCR</text>
  <text x="125" y="256" class="box-sub" text-anchor="middle">Google ML Kit</text>
  <text x="125" y="272" class="box-sub" text-anchor="middle">→ raw OCR text</text>

  <!-- arrow photo -> ocr -->
  <line x1="125" y1="195" x2="125" y2="215" class="arrow" marker-end="url(#arrowhead)"/>
  <!-- arrow ocr -> redactor -->
  <path d="M205 250 L235 250" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- On-device PHI redaction stack -->
  <rect x="240" y="125" width="320" height="420" rx="8" class="hilite"/>
  <text x="400" y="148" class="layer-title" text-anchor="middle">On-Device PHI Redaction (redact.js)</text>
  <text x="400" y="164" class="layer-sub" text-anchor="middle">Runs before any network transmission</text>

  <!-- Layer 1 -->
  <rect x="255" y="178" width="290" height="78" rx="6" class="card-device"/>
  <text x="268" y="198" class="layer-title">Layer 1 &#8212; Labeled-field regex</text>
  <text x="268" y="215" class="layer-sub">Multilingual label patterns (15 languages):</text>
  <text x="268" y="230" class="layer-sub">"Patient Name:", "DOB:", "MRN:", "Insurance:",</text>
  <text x="268" y="245" class="layer-sub">"Account #", address, email, SSN</text>

  <!-- Layer 2 -->
  <rect x="255" y="266" width="290" height="70" rx="6" class="card-device"/>
  <text x="268" y="286" class="layer-title">Layer 2 &#8212; Name propagation</text>
  <text x="268" y="303" class="layer-sub">Once patient name is detected via a label,</text>
  <text x="268" y="318" class="layer-sub">every remaining occurrence is redacted</text>

  <!-- Layer 3 -->
  <rect x="255" y="346" width="290" height="82" rx="6" class="card-device"/>
  <text x="268" y="366" class="layer-title">Layer 3 &#8212; Context-aware disambiguation</text>
  <text x="268" y="383" class="layer-sub">Separates patient vs. hospital content:</text>
  <text x="268" y="398" class="layer-sub">• patient phone redacted, hospital callback kept</text>
  <text x="268" y="413" class="layer-sub">• patient address redacted, facility address kept</text>

  <!-- Layer 4 -->
  <rect x="255" y="438" width="290" height="94" rx="6" class="card-device"/>
  <text x="268" y="458" class="layer-title">Layer 4 &#8212; Pattern-only fallback</text>
  <text x="268" y="475" class="layer-sub">Format-based regex catches unlabeled PHI:</text>
  <text x="268" y="490" class="layer-sub">• SSN (###-##-####)</text>
  <text x="268" y="505" class="layer-sub">• email, MRN, account #, insurance carrier IDs</text>
  <text x="268" y="520" class="layer-sub">• US street addresses (pattern fallback)</text>

  <!-- De-identified text box -->
  <rect x="180" y="575" width="240" height="70" rx="8" class="card-device" fill="#e6f4ea" stroke="#0a7c2f"/>
  <text x="300" y="598" class="box-title" text-anchor="middle">De-Identified Text</text>
  <text x="300" y="614" class="box-sub" text-anchor="middle">All tested PHI removed; clinical content retained</text>
  <text x="300" y="630" class="stamp-ok" text-anchor="middle">↳ leaves device over HTTPS</text>

  <!-- arrow from redactor to de-id text -->
  <path d="M400 545 L400 575" class="arrow-green" marker-end="url(#arrowhead-green)"/>

  <!-- Removed / Kept callouts -->
  <text x="40" y="310" class="list-title">What is removed</text>
  <rect x="40" y="322" width="160" height="235" rx="6" class="pill-removed"/>
  <text x="52" y="342" class="list">✗ Patient name</text>
  <text x="52" y="362" class="list">✗ Date of birth / Age</text>
  <text x="52" y="382" class="list">✗ SSN</text>
  <text x="52" y="402" class="list">✗ Phone (patient)</text>
  <text x="52" y="422" class="list">✗ Email</text>
  <text x="52" y="442" class="list">✗ MRN / Insurance ID</text>
  <text x="52" y="462" class="list">✗ Account number</text>
  <text x="52" y="482" class="list">✗ Patient address</text>
  <text x="52" y="512" class="note">All replaced with</text>
  <text x="52" y="526" class="note" font-family="monospace">[REDACTED]</text>

  <!-- ======================= PROXY ZONE ======================= -->
  <rect x="600" y="70" width="480" height="330" rx="10" class="zone-proxy"/>
  <text x="620" y="93" class="zone-label" fill="#c76a00">2 &#8212; PROXY SERVER (stateless backstop)</text>
  <text x="620" y="110" class="note">No logs · no database · no user accounts · receives text only</text>

  <!-- Proxy layer 1 -->
  <rect x="620" y="130" width="440" height="100" rx="6" class="card-proxy"/>
  <text x="640" y="152" class="layer-title">Layer 1 &#8212; Prompt-injection filter</text>
  <text x="640" y="170" class="layer-sub">Detects and strips attempted instructions aimed at the LLM</text>
  <text x="640" y="186" class="layer-sub">(e.g., "ignore previous instructions") so patient text cannot</text>
  <text x="640" y="202" class="layer-sub">manipulate the downstream model.</text>

  <!-- Proxy layer 2 -->
  <rect x="620" y="245" width="440" height="135" rx="6" class="card-proxy"/>
  <text x="640" y="267" class="layer-title">Layer 2 &#8212; NER backstop (English)</text>
  <text x="640" y="285" class="layer-sub"><tspan font-family="monospace">compromise</tspan> library — named entity recognition over any text</text>
  <text x="640" y="301" class="layer-sub">that slipped past the device redactor.</text>
  <text x="640" y="325" class="layer-sub">Second line of defense, not the primary gate.</text>
  <text x="640" y="349" class="stamp-ok">↳ scrubbed text becomes messages[0].content in LLM request</text>

  <!-- ======================= LLM ZONE ======================= -->
  <rect x="600" y="420" width="480" height="160" rx="10" class="zone-llm"/>
  <text x="620" y="443" class="zone-label" fill="#6b21a8">3 &#8212; THIRD-PARTY LLM (external)</text>

  <rect x="620" y="460" width="440" height="100" rx="6" class="card-llm" fill="#f9f2ff"/>
  <text x="840" y="485" class="box-title" text-anchor="middle">Llama 3.3 70B</text>
  <text x="840" y="505" class="box-sub" text-anchor="middle">Hosted inference API</text>
  <text x="840" y="525" class="box-sub" text-anchor="middle">Per vendor data policy: no retention, no training use</text>
  <text x="840" y="547" class="stamp" text-anchor="middle">Only de-identified, scrubbed text is ever sent here</text>

  <!-- What is kept -->
  <text x="620" y="615" class="list-title">What is kept (for clinical usefulness)</text>
  <rect x="620" y="625" width="440" height="110" rx="6" class="pill-kept"/>
  <text x="635" y="645" class="list">✓ Diagnosis</text>
  <text x="635" y="665" class="list">✓ Medications and doses</text>
  <text x="635" y="685" class="list">✓ Provider names</text>
  <text x="820" y="645" class="list">✓ Hospital name and phone</text>
  <text x="820" y="665" class="list">✓ Follow-up / appointment date</text>
  <text x="820" y="685" class="list">✓ Return precautions</text>
  <text x="635" y="715" class="note">These are required for a usable plain-language summary</text>
  <text x="635" y="728" class="note">and are deliberately retained by the redactor.</text>

  <!-- ============== CROSS-ZONE ARROWS ============== -->
  <!-- Device -> Proxy -->
  <path d="M420 610 C 560 610, 560 180, 620 180" class="arrow-green" marker-end="url(#arrowhead-green)"/>
  <text x="540" y="600" class="stamp-ok">HTTPS · de-identified text</text>

  <!-- Proxy -> LLM -->
  <path d="M840 380 L 840 460" class="arrow-green" marker-end="url(#arrowhead-green)"/>
  <text x="855" y="420" class="stamp-ok">scrubbed text</text>

  <!-- LLM -> back to app (response, plain language) -->
  <path d="M620 510 C 500 510, 500 660, 420 660" class="arrow" marker-end="url(#arrowhead)"/>
  <text x="430" y="680" class="note">Response: plain-language summary, translation, Q&amp;A</text>

  <!-- Footer -->
  <text x="550" y="760" class="note" text-anchor="middle">
    Photos never leave the device · Proxy is stateless · Only text is transmitted · No user accounts · No analytics/tracking SDKs
  </text>
</svg>
